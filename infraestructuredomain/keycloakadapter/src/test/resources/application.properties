# Config específica para tests
spring.main.allow-bean-definition-overriding=true

# Evitar conexión a Eureka durante tests
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Propiedades Keycloak requeridas por KeycloakRestService (valores dummy para tests)
keycloak.base-uri=http://localhost:8091/auth/realms/
keycloak.authorization-uri=http://localhost:8091/realms/Paymentchain/protocol/openid-connect/auth
keycloak.user-info-uri=http://localhost:8091/realms/Paymentchain/protocol/openid-connect/userinfo
keycloak.token-uri=http://localhost:8091/realms/Paymentchain/protocol/openid-connect/token
keycloak.logout=http://localhost:8091/realms/Paymentchain/protocol/openid-connect/logout
keycloak.jwk-set-uri=http://localhost:8091/realms/Paymentchain/protocol/openid-connect/certs
keycloak.certs-id=dummy

keycloak.client-id=dummy-client
keycloak.client-secret=dummy-secret
keycloak.scope=profile
keycloak.authorization-grant-type=password
keycloak.authorization-grant-type-refresh=refresh_token

